# # ===== TỐI ƯU HIỆU SUẤT =====
# repaint_delay 8
# input_delay 2
# sync_to_monitor yes
# disable_ligatures never
#
# # Advanced rendering
# x11_sync_to sync-to-vblank
# wayland_framerate 120
#
# # Scrollback buffer
# scrollback_lines 10000
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
# scrollback_pager_history_size 0
# wheel_scroll_multiplier 5.0
# touch_scroll_multiplier 1.0
#
# # Terminal bell
# enable_audio_bell no
# visual_bell_duration 0.1
# window_alert_on_bell yes
# bell_on_tab "🔔 "
# command_on_bell none
#
#
# ===== TỐI ƯU HIỆU SUẤT (OPTIMIZED) =====
# Giảm nhẹ repaint_delay xuống 10 để nhường tài nguyên cho trình biên dịch khi cần
repaint_delay 10
input_delay 2
sync_to_monitor yes

# ===== RENDERING STRATEGY (QUAN TRỌNG) =====
# Giúp render chữ nhanh hơn mà không làm giảm chất lượng
text_composition_strategy platform
# Tắt tính năng phát hiện URL khi đang scroll nhanh để tránh lag
detect_urls yes

# ===== SCROLLBACK BUFFER (DÀNH CHO DEV) =====
# Là C++ Dev, bạn sẽ hay gặp build log rất dài. 10000 dòng là hơi ít.
# Nên tăng lên để có thể kéo lên xem lỗi compile ở phía trên.
scrollback_lines 20000
# Tăng tốc độ cuộn chuột nhưng không quá nhanh để kịp đọc log
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# Giải phóng bộ nhớ đệm khi vượt quá giới hạn (tính bằng MB)
scrollback_pager_history_size 100

# ===== TỐI ƯU HỆ THỐNG HIỂN THỊ =====
# Nếu dùng X11 (KDE bản cũ)
x11_sync_to_monitor yes
# Nếu dùng Wayland (KDE Plasma 6) - hãy để khớp với tần số quét màn hình của bạn
wayland_framerate 0
# (Đặt là 0 để Kitty tự động nhận diện theo tần số quét của monitor)

# ===== TỐI ƯU LIGATURES =====
# Chỉ tắt ligatures khi con trỏ chuột nằm trên từ đó (giúp nhìn rõ ký tự gốc khi sửa code)
disable_ligatures cursor
