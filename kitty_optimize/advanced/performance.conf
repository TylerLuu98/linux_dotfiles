# ===== TỐI ƯU HIỆU SUẤT (CLEAN) =====

# Repaint delay 10ms (~100fps), cân bằng tốt giữa mượt và nhẹ
repaint_delay 10
input_delay 2

# Tắt sync để giảm input lag (tốt cho gõ code nhanh), bật lên nếu thấy xé hình
sync_to_monitor no

# ===== RENDERING STRATEGY =====
text_composition_strategy platform

# ===== SCROLLBACK BUFFER =====
scrollback_lines 5000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0
scrollback_pager_history_size 100

# ===== CÁC DÒNG ĐÃ XÓA ĐỂ FIX LỖI =====
# - x11_sync_to_monitor (Dùng sync_to_monitor chung là đủ)
# - wayland_framerate (Kitty tự động xử lý trên Wayland)

# ===== TỐI ƯU LIGATURES =====
disable_ligatures cursor
