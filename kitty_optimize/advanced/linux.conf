# linux_display_server auto
# wayland_titlebar_color system
# x11_hide_window_decorations no
# dynamic_background_opacity yes
# background_tint 0.3
# background_tint_gaps 1.0
#
# # Clipboard và Selection
# clipboard_max_size 64
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
#
# # Opacity control
# map kitty_mod+a>m set_background_opacity +0.1
# map kitty_mod+a>l set_background_opacity -0.1
# map kitty_mod+a>1 set_background_opacity 1
# map kitty_mod+a>d set_background_opacity default
#
# # Keyboard input
# touch_scroll_multiplier 1.0
# map kitty_mod+escape kitty_shell window
#
# # Graphical bell
# command_on_bell none
# enable_audio_bell no
# visual_bell_duration 0.1
# visual_bell_color #bb9af7
#
#
# ===== THIẾT LẬP RIÊNG CHO LINUX =====
linux_display_server auto
wayland_titlebar_color system

# Nếu bạn muốn giao diện tối giản, hãy thử đổi thành 'yes' 
# để xóa thanh tiêu đề phía trên (chỉ còn lại cửa sổ code)
hide_window_decorations no

# Cho phép thay đổi độ trong suốt động (phải có cái này thì phím tắt mới chạy)
dynamic_background_opacity yes
background_tint 0.3

# ===== CLIPBOARD & SELECTION =====
# Tăng kích thước clipboard lên 128MB để copy các file log dài hoặc dữ liệu lớn
clipboard_max_size 128
# write-primary: bôi đen là tự động copy (tính năng rất hay trên Linux)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# ===== PHÍM TẮT ĐIỀU CHỈNH ĐỘ TRONG SUỐT (OPACITY) =====
# kitty_mod mặc định là Ctrl+Shift
map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

# ===== KEYBOARD & SHELL =====
# Mở shell nội bộ của Kitty để debug nhanh hoặc quản lý cửa sổ
map ctrl+shift+escape kitty_shell window

# ===== GRAPHICAL BELL (THÔNG BÁO THỊ GIÁC) =====
# Thay vì tiếng kêu bip bip, terminal sẽ nháy nhẹ màu tím khi có lỗi
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #bb9af7
window_alert_on_bell yes
