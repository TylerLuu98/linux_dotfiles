# # ===== TÙY CHỈNH CON TRỎ NÂNG CAO =====
# cursor_shape beam
# cursor_beam_thickness 1.5
# cursor_underline_thickness 2.0
# cursor_blink_interval 0.5
# cursor_stop_blinking_after 15.0
#
# # Cursor indicator
# # Khi ở chế độ vim normal/command, cursor sẽ thay đổi thành block
# shell_integration cursor
#
# # Cursor color
# # cursor #7dcfff
# # cursor_text_color background
# # cursor #ff79c6
# cursor_text_color background
# cursor_inactive_color #555555
#
# # Mouse cursor
# mouse_hide_wait 3.0
# pointer_shape_when_grabbed beam
# default_pointer_shape beam
# pointer_shape_when_dragging hand
#
# # Animated Cursor
# # cursor_trail 1
#
# ===== TÙY CHỈNH CON TRỎ NÂNG CAO =====
# Kiểu con trỏ vạch đứng (giống editor)
cursor_shape beam
cursor_beam_thickness 1.8
cursor_underline_thickness 2.0

# Quản lý nhấp nháy
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Tích hợp Shell (Quan trọng cho Vim/Neovim)
# Giúp con trỏ tự đổi hình dạng: Block khi ở Normal mode, Beam khi ở Insert mode
shell_integration enabled

# ===== MÀU SẮC CON TRỎ (Tokyo Night) =====
# Màu xanh sáng đặc trưng của Tokyo Night
cursor #7aa2f7
# Màu chữ bên trong con trỏ (khi nó là hình khối/block)
cursor_text_color #1a1b26
# Màu con trỏ khi tab terminal không được focus
cursor_inactive_color #414868

# ===== HIỆU ỨNG VỆT CON TRỎ (CURSOR TRAIL) =====
# Đây là tính năng cực xịn, giúp bạn không bao giờ mất dấu con trỏ
# cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ===== CẤU HÌNH CHUỘT (MOUSE) =====
# Giấu chuột sau 3 giây không sử dụng
mouse_hide_wait 3.0
# Hình dáng chuột khi di chuyển trong terminal
default_pointer_shape beam
# Hình dáng chuột khi kéo thả hoặc chọn vùng
pointer_shape_when_dragging hand
