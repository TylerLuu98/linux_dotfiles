#
# =================================================================
# KITTY KEYBOARD SHORTCUTS - TỐI ƯU CHO C++ DEVELOPER (ARCH LINUX)
# =================================================================

# Thiết lập phím bổ trợ chính
kitty_mod ctrl+shift
clear_all_shortcuts no

# ===== 1. THAO TÁC CLIPBOARD =====
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+s paste_from_selection

# ===== 2. QUẢN LÝ CỬA SỔ (WINDOWS/SPLITS) =====
# Tạo cửa sổ mới (giữ nguyên thư mục đang làm việc - CWD)
map kitty_mod+n launch --cwd=current
map kitty_mod+w close_window

# Chia màn hình (Layout Splits)
map kitty_mod+\ launch --location=vsplit --cwd=current
map kitty_mod+- launch --location=hsplit --cwd=current

# Di chuyển giữa các cửa sổ con (Neighboring windows)
# Lưu ý: Nếu Ctrl+Alt+Arrows bị KDE chiếm, hãy đổi sang kitty_mod+arrows
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right

# Thay đổi kích thước cửa sổ con (Resize)
map ctrl+left  resize_window narrower 2
map ctrl+right resize_window wider 2
map ctrl+up    resize_window taller 2
map ctrl+down  resize_window shorter 2
map kitty_mod+r start_resizing_window

# Di chuyển vị trí cửa sổ
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward

# Chọn nhanh cửa sổ theo số
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window

# ===== 3. QUẢN LÝ TAB =====
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+q     close_tab
map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward
map kitty_mod+alt+t set_tab_title

# ===== 4. QUẢN LÝ LAYOUT =====
map kitty_mod+l next_layout
map ctrl+alt+p  goto_layout grid
map ctrl+alt+s  goto_layout stack

# ===== 5. ĐIỀU CHỈNH FONT (ZOOM) =====
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# ===== 6. HỆ THỐNG & CONFIG =====
map kitty_mod+f11    toggle_fullscreen
map kitty_mod+f10    toggle_maximized
map kitty_mod+u      kitten unicode_input
map kitty_mod+f2     edit_config_file
map kitty_mod+escape kitty_shell window

# Tải lại cấu hình nhanh và thông báo (Cực kỳ hữu ích khi đang vọc config)
map kitty_mod+f5 combine : load_config_file : kitten notify --icon info "Kitty Config" "Cấu hình đã được tải lại thành công!"

# ===== 7. CUỘN TRANG (SCROLLING) =====
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end

# ===== 8. TÍNH NĂNG NÂNG CAO (KITTEN HINTS) =====
# Nhấn kitty_mod+h rồi nhấn phím tiếp theo để copy nhanh:
map kitty_mod+h>f kitten hints --type path --program -
map kitty_mod+h>l kitten hints --type line --program -
map kitty_mod+h>w kitten hints --type word --program -
map kitty_mod+h>u kitten hints --type url --program -

# ===== 9. ĐỘ TRONG SUỐT (DYNAMIC OPACITY) =====
map kitty_mod+a>m set_background_opacity +0.1
map kitty_mod+a>l set_background_opacity -0.1
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default

# ===== 10. PHÍM TẮT ỨNG DỤNG (OVERLAY) =====
# Mở trình quản lý file Yazi
map kitty_mod+d launch --type=overlay yazi
# Mở Git UI (Lazygit)
map kitty_mod+g launch --type=overlay lazygit
# Mở trình quản lý tài nguyên (Btop)
map ctrl+alt+r  launch --type=tab --tab-title "Resources" btop
# Chọn nhanh Theme
map ctrl+alt+t  kitten themes
