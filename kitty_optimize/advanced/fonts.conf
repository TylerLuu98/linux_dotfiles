# ============================================================
# ===== CẤU HÌNH FONT NÂNG CAO - CLEAN VERSION =====
# ============================================================

# 1. Lựa chọn Font chính
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# 2. Tinh chỉnh hiển thị (Fix chữ lùn & dấu Tiếng Việt)
modify_font cell_height 120%
modify_font baseline 0
modify_font underline_position 3
modify_font underline_thickness 150%

# 3. Rendering Strategy
# Dùng legacy để render chữ nét hơn trên một số màn hình,
# nhưng nếu thấy lag thì đổi thành 'platform'
text_composition_strategy legacy

# 4. Ligatures (Ký tự nối)
disable_ligatures never

# 5. Sửa lỗi hiển thị các biểu tượng box-drawing
box_drawing_scale 0.001, 1, 1.5, 2
