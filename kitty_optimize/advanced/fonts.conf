# ============================================================
# ===== CẤU HÌNH FONT NÂNG CAO - PHIÊN BẢN TỐI ƯU TIẾNG VIỆT =====
# ============================================================

# 1. Lựa chọn Font chính (Nên dùng JetBrains Mono cho lập trình viên C++)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# 2. Giải quyết vấn đề "Chữ lùn" và "Lỗi dấu Tiếng Việt"
# Tăng lên 120% để tạo không gian cho các dấu tiếng Việt phức tạp (như ễ, ổ)
modify_font cell_height 120%
modify_font baseline 0

# Tinh chỉnh gạch chân để không đè lên dấu nặng
modify_font underline_position 3
modify_font underline_thickness 150%

# 3. Kỹ thuật hiển thị (Rendering) - Cực kỳ quan trọng trên Linux
# Ép Kitty dùng engine của hệ thống để xử lý font tốt hơn
text_composition_strategy platform

# 4. Tính năng Font đặc biệt (Ligatures)
# Giúp các toán tử C++ như ->, !=, == nhìn chuyên nghiệp hơn
disable_ligatures never
<!-- font_features JetBrainsMono Nerd Font +zero +calt +liga -->

# Sửa lỗi hiển thị các biểu tượng box-drawing (khi dùng các app terminal UI)
box_drawing_scale 0.001, 1, 1.5, 2

# 5. Bản đồ biểu tượng (Symbol Map)
# Đảm bảo các icon không chiếm chỗ của chữ, tránh lỗi lệch dòng
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+ED00-U+EFC1,U+F000-U+F2FF,U+F000-U+F2E0,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono
