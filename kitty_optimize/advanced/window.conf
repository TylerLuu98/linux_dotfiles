# ============================================================
# ===== CẤU HÌNH CỬA SỔ & TABS - OPTIMIZED FOR DEV ======
# ============================================================

# ===== THIẾT LẬP CỬA SỔ CƠ BẢN =====
remember_window_size   yes
initial_window_width   115c
initial_window_height  32c
confirm_os_window_close 0

# ===== KIỂM SOÁT KÍCH THƯỚC =====
window_resize_step_cells 2
window_resize_step_lines 2
placement_strategy center
resize_debounce_time 0.1
resize_draw_strategy static

# Ngăn cửa sổ quá nhỏ khi chia split
minimum_window_width 40c
minimum_window_height 10c

# ===== VIỀN VÀ KHOẢNG CÁCH (Gộp lại một chỗ) =====
window_border_width 1.0pt
window_margin_width 0
window_padding_width 10 12

# Màu sắc viền (Tokyo Night style)
active_border_color   #7aa2f7
inactive_border_color #24283b
bell_border_color     #ff7a93
window_border_radius  8

# ===== HIỆU ỨNG TRONG SUỐT & FOCUS =====
# Không nên để inactive_text quá mờ (0.8 là vừa, 0.5 sẽ khó đọc code)
inactive_text_alpha 0.8
background_opacity 0.95
background_tint 0.3

# ===== QUẢN LÝ LAYOUT (Chia màn hình) =====
# Nhấn Ctrl+Shift+L để chuyển đổi giữa các layout này
enabled_layouts splits,stack,tall,fat,grid
default_layout  splits

# Khi chia đôi, tự động focus vào cửa sổ mới
switch_focus_on_split true

# ===== TAB BAR NÂNG CAO =====
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_switch_strategy     previous
tab_bar_align           left

# ===== TAB TITLE TEMPLATE (Đã sửa lỗi Python hiển thị) =====
# Hiển thị tên thư mục hiện tại thay vì toàn bộ đường dẫn dài dòng
tab_title_template          "{index}: {f'{title[:20]}...' if len(title) > 20 else title} {fmt.fg.blue}[{num_windows}]"
active_tab_title_template   "{index}: {fmt.bold}{title}{fmt.nobold} {fmt.fg.blue}[{num_windows}]"

# ===== TAB COLORS =====
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
active_tab_font_style   bold
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b
inactive_tab_font_style normal

# ===== OS SPECIFIC (Linux/KDE) =====
# Nếu dùng KDE Plasma, bạn có thể để 'yes' để bỏ thanh tiêu đề phía trên cho đẹp
hide_window_decorations no
